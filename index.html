<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Deutsch Quest</title>
  <meta name="description" content="Aprenda alemão em dupla, jogando um pouco todo dia." />
  <meta name="theme-color" content="#14161f" />
  <!-- CSP: só permite scripts do próprio site e do CDN do Supabase (proteção contra XSS) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥨</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="path" class="active"><span>🗺️</span>Trilha</button>
    <button data-tab="duo"><span>💞</span>Dupla</button>
    <button data-tab="profile"><span>👤</span>Perfil</button>
  </nav>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Este app precisa de JavaScript ativado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
